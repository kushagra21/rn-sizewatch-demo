name: Bundle size
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: write
  actions: read
jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: kushagra21/rn-sizewatch@main
